name: Build LaTeX CV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 添加手动触发按钮，方便测试

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 升级到 v4
        with:
          fetch-depth: 0

      - name: Set up LaTeX
        uses: xu-cheng/latex-action@v3  # 升级到 v3
        with:
          root_file: main.tex
          # 如果编译需要多次，可以加这一行
          # latexmk_use_xelatex: true  # 如果需要中文支持

      - name: Prepare PDF for release branch
        run: |
          mkdir -p /tmp/cv_release
          cp main.pdf /tmp/cv_release/main.pdf

      - name: Create release branch with only PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan release
          # 删除所有文件（保留 .git）
          git rm -rf .  # 用 git rm 替代 find，更干净
          cp /tmp/cv_release/main.pdf .
          git add main.pdf
          git commit -m "Update CV PDF - $(date '+%Y-%m-%d %H:%M:%S')"  # 添加时间戳
          git push -f origin release

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            Automatically built from commit: ${{ github.sha }}
            
            📄 **Download**: main.pdf
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./main.pdf
          asset_name: main.pdf
          asset_content_type: application/pdf